<svg id="still" xmlns="http://www.w3.org/2000/svg" viewBox="-6 -2 384 98" width="384" height="98">
<!-- Nathan's signature for nixoncreativestudio.com: a made-up, hand-drawn mark for the site
     (src/components/ephemera/Signature.astro), not his legal signature. The page uses this file
     as a CSS mask, so its ink is the page's own colour token and the black here never shows.
     Each stroke draws in pen order: --d is how long it takes, --at when it starts (seconds).
     signature.svg#still (the :target rule) and print are the finished drawing, no motion. -->
<style>
path{fill:none;stroke:#000;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.01;animation:w var(--d) cubic-bezier(.3,.1,.35,1) var(--at) forwards}
.l{stroke-width:3}
.o{stroke-width:4.8}
@keyframes w{to{stroke-dashoffset:0}}
:target path{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){path{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
@media print{path{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
</style>
