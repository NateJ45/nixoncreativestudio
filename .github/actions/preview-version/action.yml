name: Upload a Worker preview version
description: >
  Uploads the already-built Worker as a new VERSION (not promoted, so production
  traffic is untouched) with an alias, and returns the aliased preview URL that
  the Playwright, link-check and Lighthouse steps test against. Skips cleanly,
  with a warning and no failure, when the Cloudflare secrets are absent (fork
  PRs, a repo that has not added them yet).

# Why a Worker version and not a static server: the site is hybrid. The pages
# that read EmDash (/, /work/, /work/<slug>/, /about/, /services/) are
# server-rendered from D1 + R2, so dist/client is not the whole site. A version
# upload gives the real Worker, with its real bindings, at a stable URL.
#
# Cloudflare's own docs now steer branch previews to `wrangler preview`
# (isolated resources). That is deliberately NOT used here: an isolated preview
# would start with an EMPTY D1/R2 and render every server page without content.
# A version URL runs on the production bindings, which is the point; it is
# read-only for the test suites (they only GET pages).
#
# Run it AFTER `npm run build`: wrangler follows .wrangler/deploy/config.json,
# which the Astro adapter writes, to dist/server/wrangler.json.
#
# Requires the build to have run. Needs repo secrets CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit; read on the D1, R2 and KV bindings) and
# CLOUDFLARE_ACCOUNT_ID, passed in as inputs because composite actions cannot
# read secrets themselves. See docs/PENDING.md.

inputs:
  api-token:
    description: CLOUDFLARE_API_TOKEN (may be empty)
    required: false
    default: ''
  account-id:
    description: CLOUDFLARE_ACCOUNT_ID (may be empty)
    required: false
    default: ''
  alias-prefix:
    description: >
      Prefix that keeps this workflow's aliases apart from the other's, for
      example "ci" or "lh". Lowercase letters and digits only.
    required: true

outputs:
  enabled:
    description: "'true' when a version was uploaded and url is set"
    value: ${{ steps.upload.outputs.enabled }}
  url:
    description: The aliased preview URL (no trailing slash)
    value: ${{ steps.upload.outputs.url }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        ALIAS_PREFIX: ${{ inputs.alias-prefix }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.head_ref || github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::warning title=Preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available (fork PR, or the secrets are not added yet). Skipping the Worker preview and every step that tests against it. See docs/PENDING.md."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Alias rules (Cloudflare docs): lowercase letters, digits and dashes,
        # starts with a letter, and "<alias>-<worker-name>" must fit a 63 char
        # DNS label. The worker name is ncs-ci today (6 chars), and
        # a different name would change the budget, so keep the alias at 36 or less.
        if [ -n "$PR_NUMBER" ]; then
          RAW="pr-$PR_NUMBER"
        else
          RAW="$REF_NAME"
        fi
        SLUG=$(printf '%s' "$RAW" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
        ALIAS="${ALIAS_PREFIX}-${SLUG:-x}"
        echo "Alias: $ALIAS"

        OUT_FILE="$RUNNER_TEMP/wrangler-output.ndjson"
        rm -f "$OUT_FILE"

        # WRANGLER_OUTPUT_FILE_PATH makes wrangler append one JSON line per
        # command; the "version-upload" line carries preview_url and
        # preview_alias_url (verified in wrangler 4.146 source). It is parsed
        # in preference to scraping stdout, which is only a log format.
        WRANGLER_OUTPUT_FILE_PATH="$OUT_FILE" npx wrangler versions upload \
          --preview-alias "$ALIAS" \
          --tag "${SHA:0:12}" \
          --message "CI preview for ${RAW} (${SHA:0:12})" | tee "$RUNNER_TEMP/wrangler-stdout.txt"

        URL=$(node -e '
          const fs = require("node:fs");
          let url = "";
          try {
            for (const line of fs.readFileSync(process.argv[1], "utf8").split("\n")) {
              if (!line.trim()) continue;
              const e = JSON.parse(line);
              if (e.type === "version-upload" && e.preview_alias_url) url = e.preview_alias_url;
            }
          } catch {}
          if (!url) {
            // Fallback: the log line "Version Preview Alias URL: https://..."
            const log = fs.readFileSync(process.argv[2], "utf8");
            const m = log.match(/Version Preview Alias URL:\s*(https:\/\/\S+)/);
            if (m) url = m[1];
          }
          process.stdout.write(url.replace(/\/+$/, ""));
        ' "$OUT_FILE" "$RUNNER_TEMP/wrangler-stdout.txt")

        if [ -z "$URL" ]; then
          echo "::error title=No preview URL::wrangler uploaded a version but returned no preview alias URL. Preview URLs must be enabled for the Worker (workers.dev subdomain with previews on; a Worker that implements a Durable Object never gets one). Check the Worker's Settings > Domains & Routes."
          exit 1
        fi

        echo "Preview: $URL"
        echo "enabled=true" >> "$GITHUB_OUTPUT"
        echo "url=$URL" >> "$GITHUB_OUTPUT"

        # A fresh isolate has to wake up and D1 has to answer before any suite
        # runs, so fail here, early and legibly, rather than as 40 red tests.
        for i in 1 2 3 4 5 6; do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
          [ "$CODE" = "200" ] && break
          echo "Waiting for $URL/ (HTTP $CODE), attempt $i"
          sleep 5
        done
        if [ "$CODE" != "200" ]; then
          echo "::error title=Preview not serving::$URL/ answered HTTP $CODE after the upload."
          exit 1
        fi
