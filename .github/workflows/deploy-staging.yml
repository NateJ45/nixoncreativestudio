name: Deploy staging preview

# Deploys the `staging` branch to a SEPARATE Cloudflare Worker
# (nixoncreativestudio-staging) so a change can be checked on the real edge
# before it reaches the live site. Production deploys via Cloudflare Workers
# Builds on push to main, wired separately in the Cloudflare dashboard — this
# workflow is the only way to rehearse a change first.
#
# Activates once these repo secrets exist: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. Until then the gate below skips the deploy with a
# warning rather than failing the run, so the workflow is safe to commit
# dormant (same pattern as the family's other deploy-staging.yml files).
#
# Static output (astro.config.mjs: output: 'static'), no Sanity project here,
# so a plain `wrangler deploy --name ...` reads the root wrangler.jsonc
# directly — no `-c dist/server/wrangler.json` config flag needed (that's
# only for the hybrid static+SSR sites in the family).

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping staging deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Rewrite the generated config's own `name` instead of passing --name.
      # `--name` redirects the DEPLOYMENT but not the version upload, so every
      # staging deploy was creating an undeployed version on the PRODUCTION
      # Worker, and overwriting staging's own secrets with production's binding
      # set. Confirmed 2026-09-06 across five repos: production had versions
      # stamped at staging build times that were never deployed, which is also
      # what makes `wrangler secret put` refuse with "the latest version of your
      # Worker isn't currently deployed". With the name rewritten in the config
      # itself, wrangler never has the production Worker in view at all.
      #
      # The config path is read from .wrangler/deploy/config.json rather than
      # hardcoded: a static build emits dist/client/wrangler.json and a hybrid
      # one dist/server/wrangler.json, and this repo may change shape.
      - name: Point the generated config at the staging Worker
        run: |
          CFG=$(node -e "const fs=require('fs'),p=require('path');const r=JSON.parse(fs.readFileSync('.wrangler/deploy/config.json','utf8'));console.log(p.resolve('.wrangler/deploy',r.configPath))")
          node -e "const fs=require('fs');const f=process.argv[1];const c=JSON.parse(fs.readFileSync(f,'utf8'));c.name='nixoncreativestudio-staging';fs.writeFileSync(f,JSON.stringify(c));console.log('deploy config',f,'name ->',c.name)" "$CFG"
          echo "WRANGLER_CONFIG=$CFG" >> "$GITHUB_ENV"

      - name: Deploy to the staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c ${{ env.WRANGLER_CONFIG }}
