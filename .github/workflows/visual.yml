name: Visual baselines

# Overhaul 4.3. Screenshot every route in tests/routes.ts at 1440 and 390, light
# and dark (tests/visual.spec.ts, playwright.visual.config.ts), and compare with
# the committed Linux baselines in tests/visual.spec.ts-snapshots/.
#
# Manual only, and deliberately outside ci.yml: it is NOT a required check, it
# never blocks a PR, and it never runs on a path filter. Dispatch it from the
# Actions tab or `gh workflow run visual.yml --ref <branch>`.
#
#   update: false (default)  compare; fails the run if a page drifted. The
#                            diff PNGs are in the visual-report artifact.
#   update: true             regenerate every baseline on this runner, push them
#                            to the branch visual-baselines/<run id> and open a PR
#                            into the branch you dispatched from. Review the PNG
#                            diff in that PR before merging.
#
# A push made with GITHUB_TOKEN does not start other workflows, so the baseline
# PR shows no checks until a person pushes an empty commit to its branch:
#   git commit --allow-empty -m "ci: run checks" && git push

on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Regenerate the baselines and open a PR with them'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual:
    # Pinned, like the test job: baselines are tied to the runner image's fonts.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same optimized-image cache as ci.yml (a cold AVIF/WebP encode is ~2 minutes).
      - name: Restore the optimized-image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('src/assets/**', 'src/content/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-images-

      - name: Install Playwright browser
        timeout-minutes: 15
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          timeout 360 npx playwright install --with-deps chromium || {
            sudo pkill -x apt-get || true
            echo 'DPkg::Lock::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout > /dev/null
            sudo dpkg --configure -a || true
            timeout 360 npx playwright install --with-deps chromium
          }

      - name: Compare against the baselines
        if: ${{ !inputs.update }}
        run: npx playwright test -c playwright.visual.config.ts

      - name: Regenerate the baselines
        if: ${{ inputs.update }}
        run: npx playwright test -c playwright.visual.config.ts --update-snapshots

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit the baselines and open a PR
        if: ${{ inputs.update }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already match this runner; nothing to commit."
            exit 0
          fi
          BRANCH="visual-baselines/${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "test: regenerate visual baselines (Linux, run ${GITHUB_RUN_ID})"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "test: regenerate visual baselines" \
            --body "Linux baselines regenerated by the Visual baselines workflow (run ${GITHUB_RUN_ID}). Review the PNG changes, push an empty commit so CI runs, then merge."
