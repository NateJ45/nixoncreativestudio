name: Lighthouse

# Guards the quality bar the studio sells: accessibility must stay at 100, and
# performance / best-practices / SEO drops surface as warnings. Config +
# thresholds live in lighthouserc.json (a template).
#
# HYBRID SITE: the server-rendered pages (/, /work/, /work/<slug>/, /about/,
# /services/) read EmDash and do not exist in dist/client, so this audits a
# deployed Worker VERSION preview, not a static directory. The job builds,
# uploads the version (.github/actions/preview-version, alias prefix "lh" so it
# never collides with ci.yml's "ci" alias), fills the preview URL into
# lighthouserc.generated.json with scripts/lhci-config.mjs, and runs lhci
# against it. Needs the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo
# secrets (docs/PENDING.md); without them the audit is SKIPPED with a warning
# annotation, not failed.
#
# Runs on staging pushes too, so a change can be proven green here before it
# reaches main (the family's deploy-staging.yml rehearsal path).

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same build ci.yml runs. No env needed; every PUBLIC_* variable is
      # optional and the site builds clean without them.
      - name: Build
        run: npm run build

      - name: Upload Worker preview version
        id: preview
        uses: ./.github/actions/preview-version
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          alias-prefix: lh

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json;
      # performance / best-practices / SEO are warnings. Reports upload to
      # Google's temporary public LHCI storage (shareable URL in the log).
      - name: Lighthouse CI
        if: steps.preview.outputs.enabled == 'true'
        env:
          LHCI_BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          node scripts/lhci-config.mjs
          npx lhci autorun --config=lighthouserc.generated.json
