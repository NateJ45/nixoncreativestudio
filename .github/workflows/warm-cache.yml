name: Warm page cache

# Why this exists (measured 2026-10-03, CLAUDE.md Gotchas 17, 20 and 21):
# every page is server-rendered and held by Cloudflare's route cache. A warm page
# answers in about 35ms. A page the cache does not hold costs about 0.4 to 1.4s,
# and that happens (a) for every page after a deploy, because the cache is
# partitioned by Worker version, and (b) for the pages an admin write purges
# (a menu or settings edit clears the whole site). Requesting every public page
# every few minutes means a deploy or an edit is followed by a ready page within
# minutes, so the first real visitor does not pay the render.
#
# What it does: reads the page list from the live sitemap plus the case studies
# in /rss.xml, then GETs each page. It only reads public pages and never sends
# a cookie. It is a polite 1 request per page every 5 minutes (about a dozen
# requests, mostly answered by the cache without starting the Worker).
#
# Limits, stated plainly: the requests come from GitHub's servers, so this warms
# the Cloudflare location (and shared upper tier) nearest to them, not every
# location in the world. GitHub's scheduler is best-effort and can run late. It
# never fails the run on a slow or missing page (the uptime workflow is the
# alarm); it prints a table so a "pages are slow" report can be checked against it.
#
# Public repo, so Actions minutes are free (same reasoning as uptime.yml).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe what the runner receives (temporary)
        run: |
          for u in https://nixoncreativestudio.com/sitemap-0.xml https://nixoncreativestudio.com/rss.xml https://nixoncreativestudio.com/about/; do
            echo "=== $u"
            curl -sS -L -D /tmp/h.txt -o /tmp/b.txt --max-time 25 -w 'code=%{http_code} size=%{size_download} url_effective=%{url_effective}\n' "$u" || echo "curl failed: $?"
            grep -a -i -E '^(HTTP|server|cf-cache-status|cf-mitigated|content-type|location)' /tmp/h.txt | head -8
            head -c 250 /tmp/b.txt; echo
          done
      - name: Request every public page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          base="${SITE_URL:-https://nixoncreativestudio.com}"
          base="${base%/}"
          # The apex is the canonical host (www redirects to it). If SITE_URL is
          # set to www, curl -L follows the redirect, at the cost of one hop.
          urls=$( { curl -sSL --max-time 20 "$base/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g'; \
                    curl -sSL --max-time 20 "$base/rss.xml" | grep -o '<link>[^<]*/work/[^<]*</link>' | sed 's/<[^>]*>//g'; } \
                  | grep -v '/coming-soon/' | sort -u )
          if [ -z "$urls" ]; then
            echo "::warning::Could not read the page list from $base; nothing warmed."
            exit 0
          fi
          printf '%-62s %6s %-8s %s\n' URL CODE CACHE TIME
          slow=0
          for u in $urls; do
            out=$(curl -sSL -o /dev/null -D /tmp/h.txt --max-time 25 -w '%{http_code} %{time_total}' "$u") || out="000 0"
            code=${out% *}; secs=${out#* }
            cache=$(grep -i '^cf-cache-status:' /tmp/h.txt | tail -1 | awk '{print $2}' | tr -d '\r')
            printf '%-62s %6s %-8s %ss\n' "$u" "$code" "${cache:-?}" "$secs"
            if [ "$code" != "200" ]; then slow=$((slow+1)); fi
          done
          if [ "$slow" -gt 0 ]; then
            echo "::warning::$slow page(s) did not return 200 while warming."
          fi
