name: CI

# 2026-09-06: brought up to the family test standard (WCP is the reference):
# astro check, eslint, a prettier format check, the node --test unit suites,
# the build, an internal link check over dist/client, and a separate `test`
# job running the Playwright suites (smoke, axe light + dark, reflow) on
# chromium and a WebKit iPhone profile. Before this the workflow was install,
# build, unit tests, and lint was advisory only.
#
# No Sanity here, so there is no typegen step and no stale-types guard.
#
# HYBRID SITE (EmDash migration): / , /work/ , /work/<slug>/ , /about/ ,
# /services/ and /rss.xml are server-rendered from EmDash (D1 + R2), so
# dist/client is no longer the whole site and cannot be served statically. The
# build job therefore builds, then uploads the Worker as a VERSION (not
# promoted: production is untouched) with `wrangler versions upload
# --preview-alias`, and the link check, the Playwright suites (test job) and
# Lighthouse (lighthouse.yml) run against that preview URL. The upload lives in
# .github/actions/preview-version so both workflows share it.
#
# Needs two repo secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see
# docs/PENDING.md). Without them (fork PRs, or before Nathan adds them) the
# preview-dependent steps are SKIPPED with a warning annotation, not failed;
# every static gate (types, lint, format, unit tests, drift check, build) still
# runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The preview URL the test job (and the link check below) run against.
    outputs:
      preview_enabled: ${{ steps.preview.outputs.enabled }}
      preview_url: ${{ steps.preview.outputs.url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PORTS.md card 36. Every file here marked "PORTABLE: canonical copy" is
      # diffed against ncs-astro-sanity-starter, the library of record. Both
      # repos are public, so the checkout needs no token. CRLF is normalized to
      # LF and one trailing newline ignored before comparing, so a Windows
      # working tree and a Linux runner agree; everything else is byte-exact,
      # marker line included. On DRIFT: either port the improvement up into the
      # starter with a PORTS.md card in the same commit, or pull the starter's
      # copy forward here. A file that is forked on purpose drops its marker and
      # says so in its header instead.
      #
      # Always checked against the starter's main. (There used to be a staging
      # branch that checked against the starter's staging; retired 2026-10-03.)
      - name: Check out the library of record
        uses: actions/checkout@v7
        with:
          repository: NateJ45/ncs-astro-sanity-starter
          ref: main
          path: .ncs-starter

      # The checkout is deleted again as soon as the check passes. It has to
      # live INSIDE the workspace (actions/checkout refuses a path outside it),
      # and every whole-tree tool further down this job would otherwise sweep
      # it: `prettier --check .` tries to format the library using THIS repo's
      # node_modules and dies resolving the starter's own imports, and `eslint .`
      # does the same. Deleting it here beats adding .ncs-starter to a
      # .prettierignore, a .gitignore and an eslint config in six repos, because
      # that list has to be remembered again for the next whole-tree tool.
      - name: Canonical files have not drifted
        id: sync_check
        continue-on-error: true
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: node scripts/sync-check.mjs

      # Drift is a judgement, not a diff: an improvement made here either
      # belongs in the library or is site-specific. What was missing is that
      # porting it up was an errand you had to remember to start, in another
      # repo, after the build that blocked you. This opens the PR instead. It
      # never merges, and it never turns a clear "drift" failure into a
      # confusing "could not authenticate" one: it exits 0 whatever happens.
      - name: Propose the drift to the library of record
        if: steps.sync_check.outcome == 'failure'
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: node scripts/propose-drift.mjs

      # The checkout has to go before any whole-tree tool further down this
      # job sweeps it, and the gate has to fail for real once it has.
      - name: Enforce the drift check
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: |
          rm -rf "$NCS_STARTER_DIR"
          [ "${{ steps.sync_check.outcome }}" = "success" ] || exit 1

      - name: Type check (astro check)
        run: npx astro check

      # A hard gate since 2026-09-06. The eslint-plugin-astro false positive
      # that kept lint advisory (an HTML comment inside a template expression
      # read as a JSX error) is gone: those comments are JSX comments now.
      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Node's built-in runner over src/lib/*.test.ts. Includes
      # theme-tokens.test.ts, the contrast gate: it reads the real hex tokens
      # out of globals.css and asserts the text and focus-ring pairs the
      # design system renders in both themes. Nothing else in this pipeline
      # can catch a palette edit that pushes body text or a focus outline
      # under threshold.
      - name: Unit tests (node --test)
        run: npm run test:unit

      # placeholders + OG cards + astro build (see CLAUDE.md, "Build
      # pipeline"). No env needed: the analytics, GA and coming-soon
      # variables are all optional and the site builds clean without them.
      - name: Build
        # CLOUDFLARE_ENV=ci selects the 'ci' environment in wrangler.jsonc: the preview
        # Worker uses the TRIAL database and bucket, never production data, so the
        # required checks do not depend on what production holds.
        env:
          CLOUDFLARE_ENV: ci
        run: npm run build

      # Upload the built Worker as a non-promoted version and get its aliased
      # preview URL (skips with a warning when the Cloudflare secrets are
      # absent). See .github/actions/preview-version/action.yml.
      - name: Upload Worker preview version
        id: preview
        uses: ./.github/actions/preview-version
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          alias-prefix: ci

      # linkinator crawls the PREVIEW URL (scripts/check-links.mjs), because
      # the server-rendered pages are not in dist/client. Off-site URLs are
      # skipped. The log must say "scanned N links" with N in the hundreds.
      # Without a preview this step is skipped, not run against dist/client: a
      # partial tree reports the server-rendered pages as broken links.
      - name: Check internal links
        if: steps.preview.outputs.enabled == 'true'
        env:
          LINKCHECK_URL: ${{ steps.preview.outputs.url }}
        run: npm run check:links

  test:
    runs-on: ubuntu-latest
    # Needs the preview URL, so it waits for the build job and is skipped
    # (not failed) when the build job found no Cloudflare secrets.
    needs: build
    if: needs.build.outputs.preview_enabled == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both projects in playwright.config.ts: chromium (desktop) AND
      # webkit-iphone (iPhone 14). Installing only chromium makes every webkit
      # test die with "Executable doesn't exist".
      - name: Install Playwright browsers
        # `--with-deps` runs `apt-get update`, which fails outright when the
        # runner's third-party Chrome/Microsoft apt sources are mid-sync and
        # report a "Hash Sum mismatch" (that killed a WCP deploy 2026-09-09).
        # Playwright's system libraries come from Ubuntu's own archive, so drop
        # those sources first, then retry once for transient network failures.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install --with-deps chromium webkit ||
            npx playwright install --with-deps chromium webkit

      # smoke (every route 200s and carries the studio name in its title, plus
      # an unknown case study answers 404), axe in light, axe in dark as a
      # separate sweep plus a focus-indicator check (a theme swap is a
      # different resting DOM), and reflow at 320/768/1024/1440 (WCAG 1.4.10
      # starts at 320, not 375). No webServer: playwright.config.ts reads the
      # URL from PLAYWRIGHT_BASE_URL, here the Worker preview from the build
      # job. The html reporter is added on the command line so local runs keep
      # the quiet `list` output while CI still produces the report artifact.
      - name: Run tests (smoke, a11y light + dark, reflow)
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build.outputs.preview_url }}
        run: npm test -- --reporter=github,html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
