<!doctype html>
<meta charset="utf-8" />
<title>reel encoder</title>
<!--
  Home reel encoder, loaded by scripts/brand/capture-reels.mjs into headless Chromium (served
  through a Playwright route, never a real server). It composes each output frame on a canvas
  (camera crop and zoom over the captured viewport, the drawn cursor and click ripples, the
  closing dissolve back to frame 0), encodes VP9 with WebCodecs and muxes a WebM with the small
  hand-written writer below (ported from the d8 showreel's _capture/enc.html). No ffmpeg, no npm
  package. It then decodes its own output so the review frames show the real compression.
-->
<script>
  const enc8 = new TextEncoder();
  function vint(n) {
    for (let L = 1; L <= 8; L++) {
      if (n < 2 ** (7 * L) - 1) {
        const b = new Uint8Array(L);
        let v = n;
        for (let i = L - 1; i >= 0; i--) {
          b[i] = v & 255;
          v = Math.floor(v / 256);
        }
        b[0] |= 1 << (8 - L);
        return b;
      }
    }
  }
  function uint(n, fixed) {
    const L = fixed || Math.max(1, Math.ceil(Math.log2(n + 1) / 8));
    const b = new Uint8Array(L);
    for (let i = L - 1; i >= 0; i--) {
      b[i] = n & 255;
      n = Math.floor(n / 256);
    }
    return b;
  }
  const f64 = (x) => {
    const b = new Uint8Array(8);
    new DataView(b.buffer).setFloat64(0, x);
    return b;
  };
  const hex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
  const cat = (arr) => {
    const n = arr.reduce((s, a) => s + a.length, 0);
    const o = new Uint8Array(n);
    let p = 0;
    for (const a of arr) {
      o.set(a, p);
      p += a.length;
    }
    return o;
  };
  const E = (id, ...kids) => {
    const body = cat(kids.map((k) => (typeof k === 'string' ? enc8.encode(k) : k)));
    return cat([hex(id), vint(body.length), body]);
  };

  // Matroska/WebM: EBML header, Segment { SeekHead, Info, Tracks, Clusters, Cues }
  function mux(chunks, w, h, fps) {
    const durMs = (chunks.length * 1000) / fps;
    const ebml = E(
      '1A45DFA3',
      E('4286', uint(1)),
      E('42F7', uint(1)),
      E('42F2', uint(4)),
      E('42F3', uint(8)),
      E('4282', 'webm'),
      E('4287', uint(4)),
      E('4285', uint(2)),
    );
    const info = E(
      '1549A966',
      E('2AD7B1', uint(1e6)),
      E('4489', f64(durMs)),
      E('4D80', 'nx-mux'),
      E('5741', 'nx-mux'),
    );
    const tracks = E(
      '1654AE6B',
      E(
        'AE',
        E('D7', uint(1)),
        E('73C5', uint(1)),
        E('9C', uint(0)),
        E('86', 'V_VP9'),
        E('83', uint(1)),
        E('23E383', uint(Math.round(1e9 / fps))),
        E('E0', E('B0', uint(w)), E('BA', uint(h))),
      ),
    );
    const clusters = [];
    let cur = null;
    for (const c of chunks) {
      const ms = Math.round(c.ts / 1000);
      // a new cluster at every keyframe, and before the 16-bit relative timecode overflows
      if (c.key || !cur || ms - cur.tc > 30000) {
        cur = { tc: ms, blocks: [] };
        clusters.push(cur);
      }
      const rel = ms - cur.tc;
      cur.blocks.push(
        E(
          'A3',
          cat([new Uint8Array([0x81, (rel >> 8) & 255, rel & 255, c.key ? 0x80 : 0]), c.data]),
        ),
      );
    }
    const cl = clusters.map((c) => ({
      tc: c.tc,
      bytes: E('1F43B675', E('E7', uint(c.tc)), ...c.blocks),
    }));
    const sh = (pos) =>
      E(
        '114D9B74',
        E('4DBB', E('53AB', hex('1549A966')), E('53AC', uint(pos[0], 8))),
        E('4DBB', E('53AB', hex('1654AE6B')), E('53AC', uint(pos[1], 8))),
        E('4DBB', E('53AB', hex('1C53BB6B')), E('53AC', uint(pos[2], 8))),
      );
    const shLen = sh([0, 0, 0]).length;
    let off = shLen + info.length + tracks.length;
    const cuePts = [];
    for (const c of cl) {
      cuePts.push(E('BB', E('B3', uint(c.tc)), E('B7', E('F7', uint(1)), E('F1', uint(off, 8)))));
      off += c.bytes.length;
    }
    const cues = E('1C53BB6B', ...cuePts);
    const seg = cat([
      sh([shLen, shLen + info.length, off]),
      info,
      tracks,
      ...cl.map((c) => c.bytes),
      cues,
    ]);
    return cat([ebml, hex('18538067'), vint(seg.length), seg]);
  }

  // ------------------------------------------------------------------ composition
  // The arrow is drawn, not captured: headless Chromium never paints the OS cursor.
  function drawArrow(g, x, y, s, press) {
    g.save();
    g.translate(x, y);
    g.scale(s * press, s * press);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(0, 17);
    g.lineTo(4.2, 13.2);
    g.lineTo(7, 19.6);
    g.lineTo(9.8, 18.4);
    g.lineTo(7.1, 12.2);
    g.lineTo(12.6, 12.2);
    g.closePath();
    g.shadowColor = 'rgba(0,0,0,0.28)';
    g.shadowBlur = 3;
    g.shadowOffsetY = 1;
    g.fillStyle = '#111';
    g.lineWidth = 1.6;
    g.strokeStyle = '#fff';
    g.lineJoin = 'round';
    g.stroke();
    g.shadowColor = 'transparent';
    g.fill();
    g.restore();
  }
  function drawFinger(g, x, y, s, press) {
    g.save();
    g.beginPath();
    g.arc(x, y, 15 * s * press, 0, Math.PI * 2);
    g.fillStyle = 'rgba(20,20,20,0.22)';
    g.fill();
    g.lineWidth = 2 * s;
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.stroke();
    g.restore();
  }
  function drawRipple(g, x, y, s, age) {
    // 520 ms: a ring that grows from 6 to 30 px and fades out
    const p = Math.min(1, age / 0.52);
    const r = (6 + 24 * (1 - (1 - p) ** 3)) * s;
    g.save();
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.lineWidth = 2.5 * s;
    g.strokeStyle = `rgba(255,255,255,${0.95 * (1 - p)})`;
    g.stroke();
    g.beginPath();
    g.arc(x, y, r + 1.5 * s, 0, Math.PI * 2);
    g.lineWidth = 1.2 * s;
    g.strokeStyle = `rgba(0,0,0,${0.35 * (1 - p)})`;
    g.stroke();
    g.restore();
  }

  async function bitmap(url) {
    const blob = await (await fetch(url)).blob();
    return createImageBitmap(blob);
  }

  // job: { frames: [{ url, cam:{x,y,w,h} (CSS px), dpr, cur:{x,y,op,down}|null,
  //        ripples:[{x,y,age}], mix }], W, H, fps, touch, q (vp9 quantizer) | bitrate,
  //        review: [frame indices] }
  // returns { b64, size, poster (png data url of the composed frame 0), review: [png data urls] }
  async function encodeJob(job) {
    const { W, H, fps } = job;
    const cv = new OffscreenCanvas(W, H);
    const g = cv.getContext('2d', { alpha: false });
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    const first = new OffscreenCanvas(W, H);
    const fg = first.getContext('2d', { alpha: false });
    const snap = new OffscreenCanvas(W, H);
    const sg = snap.getContext('2d', { alpha: false });
    const chunks = [];
    const cfg = {
      codec: 'vp09.00.31.08',
      width: W,
      height: H,
      framerate: fps,
      latencyMode: 'quality',
      bitrateMode: job.q != null ? 'quantizer' : 'variable',
    };
    if (job.q == null) cfg.bitrate = job.bitrate;
    const sup = await VideoEncoder.isConfigSupported(cfg);
    if (!sup.supported) throw new Error('unsupported ' + JSON.stringify(cfg));
    let failure = null;
    const enc = new VideoEncoder({
      output: (c) => {
        const d = new Uint8Array(c.byteLength);
        c.copyTo(d);
        chunks.push({ ts: c.timestamp, key: c.type === 'key', data: d, dur: c.duration });
      },
      error: (e) => {
        failure = e;
      },
    });
    enc.configure(cfg);
    let poster = null;
    for (let i = 0; i < job.frames.length; i++) {
      const f = job.frames[i];
      const bmp = await bitmap(f.url);
      const k = f.dpr;
      g.drawImage(bmp, f.cam.x * k, f.cam.y * k, f.cam.w * k, f.cam.h * k, 0, 0, W, H);
      bmp.close();
      const s = W / f.cam.w; // CSS px -> output px
      const map = (p) => [(p.x - f.cam.x) * s, (p.y - f.cam.y) * s];
      // the cursor and ripples keep their on-screen size whatever the camera zoom
      const ui = Math.max(0.8, Math.min(1.4, W / 960)) * (job.touch ? 1 : 1.15);
      for (const r of f.ripples || []) {
        const [x, y] = map(r);
        drawRipple(g, x, y, ui, r.age);
      }
      if (f.cur && f.cur.op > 0) {
        const [x, y] = map(f.cur);
        g.globalAlpha = f.cur.op;
        if (job.touch) drawFinger(g, x, y, ui, f.cur.down ? 0.82 : 1);
        else drawArrow(g, x, y, ui, f.cur.down ? 0.86 : 1);
        g.globalAlpha = 1;
      }
      if (i === 0) {
        fg.drawImage(cv, 0, 0);
        poster = await blobUrl(await first.convertToBlob({ type: 'image/png' }));
      }
      // dissolve cuts: the frame before the cut stays on top and fades out
      if (f.snapMix > 0) {
        g.globalAlpha = f.snapMix;
        g.drawImage(snap, 0, 0);
        g.globalAlpha = 1;
      }
      if (f.snap) sg.drawImage(cv, 0, 0);
      if (f.mix > 0) {
        g.globalAlpha = f.mix;
        g.drawImage(first, 0, 0);
        g.globalAlpha = 1;
      }
      const vf = new VideoFrame(cv, {
        timestamp: Math.round((i * 1e6) / fps),
        duration: Math.round(1e6 / fps),
      });
      const opt = { keyFrame: i === 0 };
      if (job.q != null) opt.vp9 = { quantizer: job.q };
      enc.encode(vf, opt);
      vf.close();
      while (enc.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 5));
      if (failure) throw failure;
    }
    await enc.flush();
    enc.close();
    if (failure) throw failure;
    chunks.sort((a, b) => a.ts - b.ts);
    const bytes = mux(chunks, W, H, fps);
    const review = await decodeReview(chunks, W, H, job.review || []);
    let str = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      str += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return {
      b64: btoa(str),
      size: bytes.length,
      poster,
      review,
      sizes: chunks.map((c) => c.data.length),
      keys: chunks.filter((c) => c.key).length,
    };
  }

  async function blobUrl(blob) {
    return await new Promise((r) => {
      const fr = new FileReader();
      fr.onload = () => r(fr.result);
      fr.readAsDataURL(blob);
    });
  }

  // decode our own stream and keep the requested frames, so review shows real compression
  async function decodeReview(chunks, W, H, want) {
    const set = new Set(want);
    const out = {};
    const cv = new OffscreenCanvas(W, H);
    const g = cv.getContext('2d');
    const pending = [];
    let idx = 0;
    const dec = new VideoDecoder({
      output: (frame) => {
        const i = idx++;
        if (set.has(i)) {
          g.drawImage(frame, 0, 0);
          pending.push(
            cv.convertToBlob({ type: 'image/png' }).then(async (b) => {
              out[i] = await blobUrl(b);
            }),
          );
        }
        frame.close();
      },
      error: (e) => {
        throw e;
      },
    });
    dec.configure({ codec: 'vp09.00.31.08', codedWidth: W, codedHeight: H });
    for (const c of chunks)
      dec.decode(
        new EncodedVideoChunk({ type: c.key ? 'key' : 'delta', timestamp: c.ts, data: c.data }),
      );
    await dec.flush();
    dec.close();
    await Promise.all(pending);
    return want.map((i) => out[i] || null);
  }
</script>
