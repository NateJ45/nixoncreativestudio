<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nixon Creative Studio. Websites that pull their weight.</title>
<meta name="description" content="Websites for churches, schools, nonprofits and small businesses, from $4,000. One person in Cincinnati does the design, the build and, when needed, the photos.">
<meta name="theme-color" content="#D4FF00" id="themeColor">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ribbon.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<a class="skip" href="#work">Skip to the work</a>

<header class="bar">
  <a class="brand" href="#top" aria-label="Nixon Creative Studio, back to top"><span>Nixon Creative Studio</span></a>
  <nav aria-label="Main">
    <a href="#work">Work</a>
    <a href="#prices">Prices</a>
    <a id="navAbout" href="#">About</a>
    <a class="go" href="#start">Start a project</a>
  </nav>
</header>

<main id="main">
  <section class="hero" id="top" data-stop="hero">
    <h1 id="headline"></h1>
    <div class="hero-foot">
      <p class="chip sub" id="sub"></p>
      <a class="chip ride-cue" href="#work"><span>Ride the reel</span> <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 0v15M1 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></a>
    </div>
  </section>

  <section class="ride" id="work" aria-label="Eight client sites"></section>

  <section class="prices" id="prices" data-stop="prices">
    <h2 class="big" data-gl data-fit="1">What it costs</h2>
    <ul class="tiers" id="tiers"></ul>
    <p class="chip after"><a id="svcLink" href="#">More on services and pricing</a></p>
  </section>

  <section class="say" id="say" data-stop="say">
    <figure class="quote">
      <blockquote id="quote"></blockquote>
      <figcaption><strong id="by"></strong><span id="role"></span></figcaption>
    </figure>
  </section>

  <section class="start" id="start" data-stop="start">
    <h2 class="big" id="startH" data-gl data-fit="1">Start a project</h2>
    <div class="reach">
      <a class="mail" id="mail" href="#"></a>
      <a class="tel" id="tel" href="#"></a>
      <p class="promise" id="reply"></p>
      <p class="promise" id="free"></p>
      <p class="place" id="place"></p>
    </div>
  </section>
</main>

<button class="pause" id="pause" type="button" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path id="pauseIcon" d="M2 1h3.6v12H2zM8.4 1H12v12H8.4z" fill="currentColor"/></svg><span id="pauseLabel">Pause motion</span></button>

<script src="../shared.js"></script>
<script src="ribbon.js"></script>
</body>
</html>
