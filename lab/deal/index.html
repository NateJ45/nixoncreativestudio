<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Nixon Creative Studio</title>
    <link rel="icon" href="data:," />

    <link
      rel="preload"
      href="/assets/fonts/bricolage.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/instrument.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/deal/kit.css" />
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <main id="main">
      <section class="hero" aria-labelledby="h">
        <h1 id="h" aria-label="I build websites that pull their weight."></h1>
        <p class="sub">
          Websites for churches, schools, nonprofits and small businesses, from $4,000. One person
          does the design, the build and, when needed, the photos.
        </p>
        <div class="stackspace" data-space></div>
      </section>
      <section class="work" id="work" aria-labelledby="wh">
        <div class="work-head">
          <h2 id="wh">Eight live sites</h2>
          <p>Open one to see inside it.</p>
        </div>
        <ul class="grid" data-grid></ul>
      </section>
      <section class="sec" id="prices" aria-labelledby="ph" style="padding-top: 0">
        <div class="sec-head">
          <h2 id="ph">Every price is public</h2>
          <p><a href="/deal/prices/">See what each one includes</a></p>
        </div>
        <div class="prices" data-prices></div>
      </section>
      <section class="sec" aria-label="What a client says" style="padding-top: 0">
        <div class="quote">
          <blockquote data-quote></blockquote>
          <span class="cite" data-cite></span>
        </div>
      </section>
      <section data-end aria-label="Start a project"></section>
    </main>
    <script src="/shared.js"></script>
    <script src="/deal/kit.js"></script>
    <script src="/deal/home.js"></script>
  </body>
</html>
